    <title>Credit restore for wealth — Finely Cred</title>
    <meta name="application-name" content="Finely Cred" />
    <style>
      /* Critical boot styles — must work before JS/CSS bundles load */
      html, body {
        margin: 0;
        min-height: 100%;
        background: #060908;
        color: #e2e8f0;
      }
      #app {
        min-height: 100vh;
      }
      #fc-boot-loader {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        font-family: Inter, system-ui, sans-serif;
        background: #060908;
      }
      #fc-boot-loader .fc-boot-logo {
        display: block;
        height: 40px;
        width: auto;
        max-width: 156px;
        object-fit: contain;
        image-rendering: auto;
      }
      #fc-boot-loader .fc-boot-spinner {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        border: 2px solid rgba(251, 191, 36, 0.22);
        border-top-color: #fbbf24;
        animation: fc-boot-spin 0.75s linear infinite;
      }
      #fc-boot-loader .fc-boot-label {
        font-size: 12px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        opacity: 0.55;
        color: rgba(255, 255, 255, 0.72);
      }
      @keyframes fc-boot-spin {
        to { transform: rotate(360deg); }
      }
      html.fc-app-ready #fc-boot-loader {
        display: none !important;
      }
      #fc-seo-doc {
        box-sizing: border-box;
        max-width: 44rem;
        margin: 0 auto;
        padding: 3.25rem 1.5rem 2rem;
        font-family: Inter, system-ui, sans-serif;
        color: #e2e8f0;
      }
      #fc-seo-doc h1 {
        margin: 0 0 0.75rem;
        font-size: 1.85rem;
        line-height: 1.2;
        color: #fbbf24;
        font-weight: 700;
      }
      #fc-seo-doc p, #fc-seo-doc li {
        opacity: 0.8;
        line-height: 1.65;
        margin: 0 0 0.85rem;
      }
      #fc-seo-doc a { color: #fbbf24; }
      html.fc-app-ready #fc-seo-doc { display: none !important; }
      #fc-boot-error {
        display: none;
        min-height: 100vh;
        padding: 2rem;
        font-family: Inter, system-ui, sans-serif;
        max-width: 42rem;
        margin: 0 auto;
      }
      html.fc-boot-failed #fc-boot-loader { display: none !important; }
      html.fc-boot-failed #fc-boot-error { display: block; }
    </style>
    <script type="application/ld+json" id="fc-org-schema">{"@context":"https://schema.org","@type":"Organization","@id":"https://finelycred.com/#organization","name":"Finely Cred","url":"https://finelycred.com","description":"Credit restore, dispute letters, business credit, and funding readiness platform."}</script>
    <script type="application/ld+json" id="fc-website-schema">{"@context":"https://schema.org","@type":"WebSite","name":"Finely Cred","url":"https://finelycred.com","description":"Credit restore, dispute letters, business credit, and funding readiness.","publisher":{"@id":"https://finelycred.com/#organization"}}</script>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('finely.siteTheme.v3');
          var path = location.pathname || '/';
          var isWorkspace = /^\/(admin|portal|dashboard|preview|onboarding|account|owners-guide)\b/.test(path);
          var pref = isWorkspace ? (stored === 'dark' ? 'dark' : 'light') : 'dark';
          document.documentElement.setAttribute('data-fc-theme', pref);
          document.documentElement.setAttribute('data-fc-theme-pref', stored === 'dark' || stored === 'light' ? stored : pref);
          document.documentElement.style.colorScheme = pref;
          // Clear stale service workers that cached blank shells (one-time boot fix).
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              for (var i = 0; i < regs.length; i++) regs[i].unregister();
            });
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <article id="fc-seo-doc">
      <h1>Credit restore for wealth</h1>
      <p>Personal credit restore, business credit, debt strategy, tradelines, and funding readiness — with guided workflows and partner education.</p>
    </article>
    <div id="app">
      <div id="fc-boot-loader">
        <img class="fc-boot-logo" src="/brand/finely-cred-logo-dark.png" alt="Finely Cred" width="156" height="40" decoding="async" />
        <div class="fc-boot-spinner" aria-hidden="true"></div>
        <div class="fc-boot-label">Loading</div>
      </div>
      <div id="fc-boot-error">
        <p style="font-size:1.25rem;margin:0 0 0.75rem">Finely Cred could not start</p>
        <p id="fc-boot-error-msg" style="opacity:0.8;line-height:1.5;margin:0 0 1rem"></p>
        <p style="opacity:0.65;font-size:0.875rem;line-height:1.5;margin:0">
          Try a hard refresh (Ctrl+Shift+R). Dev URL:
          <strong>http://127.0.0.1:5173/</strong>
        </p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
