<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#060908" />
    <title>Finely Cred - Sovereign Credit Architecture</title>
    <meta name="application-name" content="Finely Cred" />

    <!-- Favicon: official gold medallion (not Vite default) -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/favicon-32x32.png" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/brand/finely-cred-icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="mask-icon" href="/brand/finely-cred-icon.svg" color="#fbbf24" />

    <!-- Marketing: unregister stale SW before React boot (launch index.html used to fight pwaRegister) -->
    <script>
      (function () {
        try {
          var p = location.pathname || '/';
          var workspace = /^\/(admin|portal|dashboard|business|seller)\b/.test(p);
          if (!workspace && 'serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              for (var i = 0; i < regs.length; i++) regs[i].unregister();
            });
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
