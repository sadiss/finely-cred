[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "https://www.finelycred.com/*"
  to = "https://finelycred.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/blog"
  to = "/resources"
  status = 301

[[redirects]]
  from = "/blog/*"
  to = "/resources"
  status = 301

[[redirects]]
  from = "/learn"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/learn/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/admin/*"
  to = "/spa-fallback.html"
  status = 200

[[redirects]]
  from = "/portal/*"
  to = "/spa-fallback.html"
  status = 200

[[redirects]]
  from = "/dashboard/*"
  to = "/spa-fallback.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/spa-fallback.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
